<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catacomb: Diablo Classic ARPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #060507;
      color: #e6dac3;
      font-family: 'Cinzel', 'Times New Roman', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 600px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(180, 40, 20, 0.3);
      border: 3px solid #3c2a1a;
      border-radius: 4px;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a080d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .loading-title {
      font-size: 28px;
      letter-spacing: 4px;
      color: #b82b18;
      text-shadow: 0 0 10px #ff3311;
      margin-bottom: 12px;
    }
    .loading-sub {
      font-size: 14px;
      color: #8a7e6b;
      letter-spacing: 2px;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="game-container">
    <div id="loading-overlay">
      <div class="loading-title">CATACOMB</div>
      <div class="loading-sub">Forging the Sanctuary...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
